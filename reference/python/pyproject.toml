[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-reference"
version = "0.3.0a0"
description = "Agent Market Protocol v0.3 reference implementation and conformance vectors"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["cryptography>=42", "coincurve>=19"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18", "referencing>=0.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["amp"]
